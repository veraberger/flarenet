[tool.poetry]
name = "flarenet"
version = "0.1.1"
description = "a convolutional neural network to predict flares in 20-second TESS data"
authors = ["Vera Berger <vlberger@mit.edu>, Nicole Schanche <nicole.e.schanche@nasa.gov>"]
license = "MIT"
readme = "README.md"
packages = [{include = "flarenet", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.9,<=3.12"
lksearch = ">=1.2.0" 
lightkurve = ">=2.5.0"
numpy = ">=1.26.0"
tensorflow = ">=2.17.0,<2.18.0"
scikit-learn = ">=1.3.0"
astropy = ">=5.3"
pandas = ">=2.2,<3.0"
batman-package = "^2.4.8"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"